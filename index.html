<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="description" content="Sistem kasir dan laporan keuangan Ammar Cell" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ammar Cell" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <title>Ammar Cell — Kasir</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- SW Registration di luar React agar tidak block render -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Unregister SW lama dulu
          navigator.serviceWorker.getRegistrations().then(regs => {
            const unregs = regs.filter(r => !r.active?.scriptURL?.includes('sw.js'));
            return Promise.all(unregs.map(r => r.unregister()));
          }).then(() => {
            navigator.serviceWorker.register('/sw.js')
              .then(() => console.log('SW registered'))
              .catch(err => console.log('SW error:', err));
          });
        });
      }
    </script>
  </body>
</html>
